
services:
 
  mongo:
    profiles: ["mongo"]
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-change_me_123}
    volumes:
      - mongo_data:/data/db 
    networks:
      - db_net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mongo-express:
    profiles: ["mongo"]
    image: mongo-express:1.0.2
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-change_me_123}@mongo:27017/?authSource=admin
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:-admin123}
    ports:
      - "8081:8081"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - public_net
      - db_net

  
  postgres:
    profiles: ["postgres"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-listings}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_123}
      POSTGRES_DB: ${POSTGRES_DB:-listings}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - db_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgadmin:
    profiles: ["postgres"]
    image: dpage/pgadmin4:8
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - public_net
      - db_net

  
  backend:
    build: .
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_TYPE: ${DB_TYPE:-mongo}
      
      MONGO_URI: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-change_me_123}@mongo:27017/${MONGO_DB:-listings}?authSource=admin
      DATABASE_URL: postgres://${POSTGRES_USER:-listings}:${POSTGRES_PASSWORD:-change_me_123}@postgres:5432/${POSTGRES_DB:-listings}
      JWT_SECRET: ${JWT_SECRET:?Задайте JWT_SECRET в .env}
      CLIENT_URL: http://localhost
    ports:
      - "3000:3000" 
    volumes:
      - uploads:/app/uploads 
    
    depends_on:
      mongo:
        condition: service_healthy
        required: false
      postgres:
        condition: service_healthy
        required: false
    networks:
      - public_net
      - db_net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  
  frontend:
    build:
      context: ./client
      args:
        VITE_API_URL: "" 
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - public_net


networks:
  public_net:
  db_net:
    internal: true

volumes:
  mongo_data:
  pgdata:
  uploads: